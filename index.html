<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>STIK OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2233'/%3E%3Cpath d='M6 46 24 20l9 13 6-8 19 21z' fill='%23a9a9a9'/%3E%3Crect x='14' y='30' width='38' height='12' rx='3' fill='%23e5312e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f6;--surface:#fff;--surface2:#f7f8fa;--ink:#0f1f2e;--ink2:#38495a;--muted:#6a7988;--line:#dbe1e8;--line2:#e9edf2;
  --red:#e5312e;--red-ink:#b5211e;--red-soft:#fdecec;--blue:#2b5db8;--blue-soft:#e7effb;--green:#1b8449;--green-soft:#e4f4ea;--amber:#a86a0a;--amber-soft:#fcf1d8;--gray-soft:#eceff3;
  --pri:#0f2233;--pri-ink:#fff;--pri-h:#1a3550;
  --r:10px;--shadow:0 1px 2px rgba(15,31,46,.06),0 6px 18px rgba(15,31,46,.05);
  --font:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --head:'Montserrat','IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0b1218;--surface:#121c26;--surface2:#172330;--ink:#e7edf3;--ink2:#c0cbd6;--muted:#8998a7;--line:#25343f;--line2:#1b2933;
  --red-soft:#3b1b1c;--blue-soft:#15263d;--green-soft:#12301f;--amber-soft:#34290f;--gray-soft:#1c2935;--red-ink:#ff8a86;--blue:#7fa8ee;--green:#54c987;--amber:#e6b24a;
  --pri:#e7edf3;--pri-ink:#0b1218;--pri-h:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);margin:0;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}.grow{flex:1}
.mono{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50}
.brand{padding:16px 16px 10px}
.brand .logo{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.brand .logo img{display:block;width:100%;height:auto}
.nav{padding:4px 10px 18px;flex:1}
.nav h6{margin:16px 10px 6px;font:600 11.5px/1 var(--head);color:var(--muted);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500;position:relative}
.nav a:hover{background:var(--surface2);text-decoration:none}
.nav a.on{background:var(--gray-soft);color:var(--ink);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.nav a .cnt.hot{background:var(--red);color:#fff;border-radius:99px;padding:0 6px;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .burger{display:none}
.searchbtn{display:flex;align-items:center;gap:8px;min-width:260px;max-width:420px;flex:1;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--muted);cursor:pointer}
.searchbtn kbd{margin-left:auto;font:11px var(--font);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--green)}.pill.busy i{background:var(--amber);animation:pulse 1s infinite}.pill.err i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.view{padding:22px 24px 60px;max-width:1500px;width:100%}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:22px;font-weight:700}
.ph .sub{color:var(--muted);margin-top:2px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface2);text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.btn.pri:hover{background:var(--pri-h)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-ink)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--gray-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px}.btn.icon{padding:7px}
.btn.danger{color:var(--red-ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:none;min-height:36px}
.in:focus,.btn:focus-visible,.searchbtn:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.in[readonly]{background:var(--surface2)}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 4px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--red)}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card h3{font-size:14px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gray-soft);color:var(--ink2);white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.red{background:var(--red-soft);color:var(--red-ink)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .in{width:auto;min-width:180px}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font:600 12px var(--head);color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th .ar{color:var(--red);margin-left:3px}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;max-width:340px}
.tbl td.wrap{white-space:normal}
.tbl td>.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--surface2)}
.tbl tr.tone-danger td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tbl tr.tone-warn td:first-child{box-shadow:inset 3px 0 0 #e0a21a}
.tbl tr.tone-ok td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.tbl tfoot td{background:var(--surface2);font-weight:600;border-top:1px solid var(--line)}
.tbl .rowact{opacity:0;display:flex;gap:2px;justify-content:flex-end}
.tbl tr:hover .rowact{opacity:1}
.thumb{width:46px;height:36px;border-radius:6px;object-fit:cover;background:var(--gray-soft);display:block;border:1px solid var(--line2)}
.thumb.empty-t{display:grid;place-items:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;color:var(--muted);font-size:12.5px}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--gray-soft);border-radius:var(--r);padding:8px;min-height:120px}
.col h4{font:600 12.5px var(--head);padding:6px 6px 8px;display:flex;justify-content:space-between;color:var(--ink2)}
.col.over{outline:2px dashed var(--blue)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}.kcard b{display:block;margin-bottom:2px}.kcard .m{color:var(--muted);font-size:12.5px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(9,17,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:100;overflow:auto;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .14s}
@keyframes pop{from{transform:translateY(8px);opacity:.6}}
.modal.wide{width:min(980px,100%)}.modal.xl{width:min(1180px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:16px;flex:1}
.mb{padding:18px;max-height:calc(92vh - 130px);overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 14px 14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--pri);color:var(--pri-ink);padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:380px;animation:pop .15s}
.toast.err{background:var(--red);color:#fff}.toast.ok{background:var(--green);color:#fff}

/* widgets */
.imgw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgw .pv{width:110px;height:82px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);overflow:hidden;background:var(--surface2)}
.imgw .pv img{width:100%;height:100%;object-fit:cover}
.files{border:1px dashed var(--line);border-radius:9px;padding:8px;background:var(--surface2)}
.files.drag{border-color:var(--blue);background:var(--blue-soft)}
.frow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px}
.frow:hover{background:var(--surface)}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:block;color:inherit}
.kpi:hover{text-decoration:none;border-color:var(--ink2)}
.kpi .v{font:700 24px var(--head);margin-top:4px;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hot .v{color:var(--red)}
.hero{position:relative;overflow:hidden;border-radius:14px;background:var(--pri);color:var(--pri-ink);padding:24px 26px 70px;margin-bottom:16px}
.hero h1{font-size:24px;font-weight:700}
.hero p{margin:4px 0 14px;opacity:.75}
.hero svg.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:78px;opacity:.9}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:inherit}
[data-theme=dark] .hero .btn{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.2)}
.hero .btn.red{background:var(--red);border-color:var(--red);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.list .li{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer;color:inherit}
.list .li:hover{background:var(--surface2);text-decoration:none}.list .li:last-child{border-bottom:0}
.list .dt{width:50px;font:600 12px var(--head);color:var(--muted);flex:none}
.bar{height:8px;background:var(--gray-soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}

/* folders */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.fold{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:inherit}
.fold:hover{border-color:var(--ink2);text-decoration:none}.fold .ic{color:#d99a1c}
.fold small{display:block;color:var(--muted)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--muted)}
.crumbs a{font-weight:600}
.dropz{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);margin-bottom:12px}
.dropz.drag{border-color:var(--blue);background:var(--blue-soft)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dh{padding:8px;background:var(--surface2);font:600 12px var(--head);text-align:center;border-bottom:1px solid var(--line)}
.cal .dc{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;overflow:hidden}
.cal .dc:nth-child(7n+7){border-right:0}
.cal .dc.other{background:var(--surface2);opacity:.6}.cal .dc.today .n{background:var(--red);color:#fff}
.cal .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600}
.ev{display:block;font-size:11.5px;padding:1px 6px;border-radius:5px;margin-top:2px;background:var(--gray-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ev.red{background:var(--red-soft);color:var(--red-ink)}.ev.blue{background:var(--blue-soft);color:var(--blue)}.ev.green{background:var(--green-soft);color:var(--green)}.ev.amber{background:var(--amber-soft);color:var(--amber)}

/* command palette */
.cmd{width:min(640px,100%);margin-top:8vh}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none;border-radius:14px 14px 0 0}
.cmd .res{max-height:56vh;overflow:auto;padding:6px}
.cmd .res h6{margin:10px 10px 4px;font:600 11.5px var(--head);color:var(--muted)}
.cmd .res a{display:flex;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);align-items:baseline}
.cmd .res a.on,.cmd .res a:hover{background:var(--gray-soft);text-decoration:none}

/* AI chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--pri);color:var(--pri-ink)}
.msg.a{align-self:flex-start;background:var(--gray-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:99px;cursor:pointer;font-size:12.5px}
.chip:hover{background:var(--surface2)}

/* offer editor */
.oe{display:grid;grid-template-columns:minmax(420px,520px) minmax(0,1fr);gap:16px;align-items:start}
.oe .left{display:flex;flex-direction:column;gap:14px}
.oe .prev{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;background:var(--gray-soft);border-radius:12px;padding:12px;border:1px solid var(--line)}
.sec{padding:14px 16px}.sec>h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.icard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);margin-bottom:10px}
.icard .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.icard .hd input{font-weight:600}
.gal{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.gal img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.55}
.gal img.on{border-color:var(--red);opacity:1}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-variant-numeric:tabular-nums}
.tot .big{font:700 17px var(--head);color:var(--blue)}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center}

/* offer pages (preview/print/raster) */
.op{width:794px;min-height:1123px;background:#fff;color:#111;position:relative;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.35;overflow:hidden}
.op-in{padding:52px 58px}
.op-no{font:italic 700 17px Georgia,'Times New Roman',serif;color:#000;margin-bottom:8px}.op-no i{font-weight:400;font-size:15px}
.op-logo{display:block;width:250px;margin:6px 0 18px -6px}
.op-co{font:15px/1.35 'Times New Roman',Times,serif;color:#000}
.op-co .u{color:#1a3fd0;text-decoration:underline;font-weight:700;font-style:italic}
.op-fis{margin-top:14px;font:italic 12px/1.35 'Times New Roman',serif;color:#111}
.op-cust{margin-top:64px;font:14px/1.4 Arial,sans-serif}.op-cust .lbl{color:#666;font-style:italic;margin-bottom:12px}.op-cust .nm{font:italic 700 16px Arial;color:#000;margin-bottom:2px}
.op-note{margin-top:120px;color:#8a8a8a;font-style:italic;font-size:14px}
.op-h{font:italic 700 20px/1.25 Georgia,'Times New Roman',serif;color:#2450b4;margin:0 0 22px}
.op-sub{font:italic 13px Arial;color:#2450b4;margin-top:-16px;margin-bottom:16px}
.op-img{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.op-img img{max-width:100%;max-height:430px;object-fit:contain}.op-img.multi img{max-width:calc(50% - 4px);max-height:240px}.op-img img.first{max-height:430px;max-width:100%}
.op-banner{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 24px 0 14px;background:linear-gradient(90deg,#e4eef8,#a9c9ea);margin-bottom:16px}
.op-banner img{height:34px;background:#fff;border-radius:3px;padding:2px 6px}.op-banner span{font:italic 13px Arial;color:#222}
.op-p{font:700 14px Georgia,serif;margin:0}.op-p b{color:#000}.op-p span{color:#2450b4}
.op-l{font:italic 13px 'Times New Roman',serif;color:#2450b4;margin-top:1px}
.op-eqt{font:italic 700 13px Georgia,serif;color:#707070;margin:22px 0 6px}
.op ul.eq{margin:0;padding:0;list-style:none;font:italic 12.5px 'Times New Roman',serif;color:#777}.op ul.eq li{margin:1px 0}.op ul.eq li::before{content:"- "}
.op-dash{border-top:1px dashed #999;margin-top:18px}
.op-tot{margin-top:24px;font:italic 20px 'Times New Roman',serif;color:#777}.op-tot div{margin-bottom:0}
.op-line{color:#777;letter-spacing:2px;font:italic 15px 'Times New Roman'}
.op-grand{font:italic 700 20px Georgia,serif;color:#2450b4;margin:4px 0 20px}
.op-terms{font:italic 12.5px/1.5 'Times New Roman',serif;color:#777}
.op-ft{position:absolute;left:58px;right:58px;bottom:18px;font:10px Arial;color:#999;display:flex;justify-content:space-between}

/* misc */
.notice{padding:10px 14px;border-radius:9px;background:var(--amber-soft);color:var(--amber);font-size:13px;margin-bottom:12px}
.notice.blue{background:var(--blue-soft);color:var(--blue)}.notice.red{background:var(--red-soft);color:var(--red-ink)}
.stepn{width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:inline-grid;place-items:center;font:700 12px var(--head);flex:none}
pre.code{background:#0d1a26;color:#d8e6f3;padding:12px;border-radius:9px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.sr{position:absolute;left:-9999px}

@media (max-width:1180px){.oe{grid-template-columns:1fr}.oe .prev{position:static;max-height:none}.two{grid-template-columns:1fr}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-300px;width:280px;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .side{left:0}
  .top .burger{display:inline-flex}.top{padding:8px 12px}.view{padding:14px 12px 60px}
  .searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
  .grid3,.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
  .tbl td{max-width:200px}
}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:10px 12px}.kpi .v{font-size:19px}.ph h1{font-size:19px}.hero{padding:18px 16px 64px}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}.side,.top,.toasts,.ph .acts,.toolbar,.foot,.oe .left,.no-print{display:none!important}
  .app{display:block}.view{padding:0;max-width:none}.oe{display:block}.oe .prev{position:static;max-height:none;background:none;border:0;padding:0}
  .pages{display:block}.op{box-shadow:none;page-break-after:always;zoom:1!important;margin:0}
  .tbl-wrap{border:0;box-shadow:none}.tbl .rowact{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* PDF strani (rezerva) */
.rp{position:relative;background:#fff;color:#111;font:11px/1.4 Arial,Helvetica,sans-serif;overflow:hidden}
.rp-h{position:absolute;top:20px;left:36px;right:36px;height:40px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #d5dbe2;padding-bottom:6px}
.rp-h img{height:32px;width:auto}.rp-h b{font-size:11px}.rp-h small{display:block;color:#666;font-size:9px}.rp-h span{margin-left:auto;color:#666;font-size:10px}
.rp-b{position:absolute;top:72px;left:36px;right:36px;bottom:40px;overflow:hidden}
.rp-f{position:absolute;left:36px;right:36px;bottom:14px;text-align:center;color:#999;font-size:9px}
.rp-title{font:700 20px Arial,sans-serif;margin:0 0 3px}.rp-sub{color:#666;margin-bottom:12px;font-size:11px}
.rp-hh{font:700 14px Arial,sans-serif;margin:14px 0 6px}.rp-p{margin:0 0 5px;font-size:11.5px;white-space:pre-wrap}
table.rp-t{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10.5px}
.rp-t th{background:#eef1f5;text-align:left;padding:4px 6px;border:1px solid #dde3e9;font-size:10px}
.rp-t td{padding:4px 6px;border:1px solid #dde3e9;vertical-align:top;overflow-wrap:anywhere}
.rp-t td.r,.rp-t th.r{text-align:right}.rp-t td.k{background:#f3f5f8;font-weight:700;width:26%}
.rp-t tr.ft td{background:#f7f8fa;font-weight:700}.rp-t img{max-width:52px;max-height:40px;display:block}
.rp-bar{background:#eceff3;height:10px;border-radius:5px;overflow:hidden}.rp-bar i{display:block;height:100%;background:#e5312e}
.rp-imgs{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}.rp-imgs img{max-width:48%;max-height:230px;object-fit:contain;border:1px solid #dde3e9}

function num(v){if(typeof v==='number')return isFinite(v)?v:0;if(v==null)return 0;let s=String(v).trim().replace(/[€\s]|EUR/gi,'');if(!s)return 0;
  if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}

function parseDelimited(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/,1)[0]||'';const d=first.includes('\t')?'\t':(first.split(';').length>=first.split(',').length?';':',');

const plainCell=(r,f)=>{const v=fieldVal(r,f);if(f.t==='files')return(v||[]).map(x=>x.name).join(', ');if(f.t==='image')return'';if(f.t==='check')return v?'da':'';if(f.t==='select')return optLbl((f.opts||[]).find(o=>optVal(o)===v)||v);

function sortList(list,M,st){const f=M.fields.find(x=>x.k===st.k),dir=st.d||1;const get=r=>st.k==='_c'?(r._c||''):(f?fieldVal(r,f):r[st.k])??'';

async function storeFile(file){let blob=file,type=file.type||'application/octet-stream';

function mkField(f,val,M){let c;const dv=val;

    case'combo':{const e=simple('input','text'),id='dl_'+uid();e.setAttribute('list',id);e.value=dv??'';const dl=document.createElement('datalist');dl.id=id;dl.innerHTML=comboOptions(f,M.key).map(o=>`<option value="${esc(o)}">`).join('');const w=wrap(e);w.append(dl);c={el:w,get:()=>e.value.trim(),set:v=>e.value=v??''};break}

  return c}
function openForm(M,rec,defaults={}){const isNew=!rec;const r=rec||{};const ctrls={};const grid=document.createElement('div');grid.className='grid2';

function openImport(M,onDone){const cols=M.fields.filter(f=>f.t!=='computed'&&f.t!=='files'&&f.t!=='image'&&f.t!=='links');const order=(M.importOrder||cols.filter(f=>f.list).map(f=>f.k));
  const m=Modal.open({title:'Uvoz iz Excela / CSV – '+M.title,cls:'wide',body:`<div class="notice blue">V Excelu (ali Minimaxu) označi celice, kopiraj (Ctrl+C) in prilepi sem. Vrstni red stolpcev: <b>${order.filter(k=>!k.endsWith('skip')).map(k=>esc((M.fields.find(f=>f.k===k)||{l:k}).l)).join(' → ')}</b>. Prva vrstica z naslovi stolpcev ni obvezna – če jo prilepiš, se stolpci prepoznajo po imenu.</div><textarea class="in" rows="9" placeholder="Prilepi podatke sem…"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" id="impF">${ic('up','sm')}Izberi datoteko CSV</button><input type="file" accept=".csv,.tsv,.txt" hidden id="impFi"></div><div id="impPv" style="margin-top:12px"></div>`,
    foot:[{l:'Prekliči'},{l:'Uvozi',cls:'pri',fn:()=>go()}]});
  const ta=$('textarea',m.el),pv=$('#impPv',m.el);let parsed=[];
  const conv=(f,v)=>{v=String(v??'').trim();if(!f)return v;if(f.t==='date')return parseDate(v);if(['money','number','percent'].includes(f.t))return v===''?'':num(v);if(f.t==='check')return/^(da|yes|true|1|x|✓)$/i.test(v);return v};
  const analyze=()=>{const rows=parseDelimited(ta.value);parsed=[];if(!rows.length){pv.innerHTML='';return}
    const norm=s=>String(s).toLowerCase().replace(/[^a-zčšž0-9]/g,'');const labels=new Map(cols.map(f=>[norm(f.l),f]));
    const hdr=rows[0].map(h=>labels.get(norm(h)));const isHdr=hdr.filter(Boolean).length>=Math.min(2,rows[0].length);
    const map=isHdr?hdr:order.map(k=>cols.find(f=>f.k===k)||null);const body=isHdr?rows.slice(1):rows;
    body.forEach(row=>{const o={};map.forEach((f,i)=>{if(f&&row[i]!=null)o[f.k]=conv(f,row[i])});if(Object.keys(o).length)parsed.push(o)});
    const show=map.map(f=>f);pv.innerHTML=`<div class="small muted" style="margin-bottom:6px">Prepoznanih vrstic: <b>${parsed.length}</b>${isHdr?' (glava prepoznana)':''}. Predogled:</div><div class="tbl-wrap"><table class="tbl"><thead><tr>${show.map(f=>`<th>${f?esc(f.l):'—'}</th>`).join('')}</tr></thead><tbody>${parsed.slice(0,5).map(o=>`<tr>${show.map(f=>`<td>${f?esc(f.t==='date'?fmtDate(o[f.k]):o[f.k]??''):''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
  ta.addEventListener('input',debounce(analyze,300));$('#impF',m.el).onclick=()=>$('#impFi',m.el).click();
  $('#impFi',m.el).onchange=async e=>{const f=e.target.files[0];if(f){ta.value=await f.text();analyze()}};
  const go=()=>{analyze();if(!parsed.length){toast('Ni podatkov za uvoz.','err');return false}parsed.forEach(o=>{if(M.tabs&&!o[M.tabs.k])o[M.tabs.k]=UIS[M.key]?.tab||M.tabs.def;DB.upsert(M.key,o,{quiet:true,silent:true})});DB.log('add',M.key,{id:'imp',naziv:`Uvoz ${parsed.length} vrstic`});bus.emit('data',{k:M.key});toast(`Uvoženih ${parsed.length} vrstic`,'ok');onDone&&onDone()}}

function folderPath(id){const out=[];let f=id&&DB.get('mape',id);while(f){out.unshift(f);f=f.parent&&DB.get('mape',f.parent)}return out}
function delFolderDeep(id){DB.all('mape').filter(f=>f.parent===id).forEach(f=>delFolderDeep(f.id));DB.all('datoteke').filter(x=>x.folder===id).forEach(x=>{if(x.blob)Blobs.remove(x.blob);DB.remove('datoteke',x.id)});DB.remove('mape',id)}

      $('#dlF',root).onclick=async()=>{if(await confirmDlg(`Izbrišem mapo »${cur.name}« z vso vsebino?`,{ok:'Izbriši',danger:true})){const p=cur.parent;delFolderDeep(cur.id);location.hash='#/mape/'+sec+(p?'/'+p:'')}}}
    const dz=$('#dz',root);['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');addFiles([...e.dataTransfer.files],parent)});
        $$('tr[data-i]',root).forEach(tr=>tr.onclick=async e=>{const x=DB.get('datoteke',tr.dataset.i);if(!x)return;
      if(e.target.closest('[data-npdf]'))return exportRDoc(noteDoc(x));
      if(e.target.closest('[data-rm]')){if(await confirmDlg(`Izbrišem »${x.name}«?`,{ok:'Izbriši',danger:true})){if(x.blob)Blobs.remove(x.blob);DB.remove('datoteke',x.id)}return}

/* ---------- pomožno: računanje kilometrov (OSRM + Nominatim, brezplačno) ---------- */
FormTools.calcKm=async ctx=>{const rel=ctx.get('relacija');if(!rel){toast('Najprej vpiši relacijo (npr. Oplotnica – Maribor).','err');return}
  const stops=rel.split(/\s*(?:–|—|->|→|>|\s-\s|;)\s*/).map(s=>s.trim()).filter(Boolean);if(stops.length<2){toast('Relacija naj vsebuje vsaj dva kraja, ločena z –','err');return}
  const pts=[];for(const s of stops){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(s));const j=await r.json();if(!j[0])throw new Error('Kraja ni mogoče najti: '+s);pts.push(j[0].lon+','+j[0].lat);await sleep(1100)}
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.join(';')}?overview=false`);const j=await r.json();if(!j.routes||!j.routes[0])throw new Error('Poti ni mogoče izračunati.');
  let km=j.routes[0].distance/1000;if(ctx.get('povratno'))km*=2;ctx.set('km',Math.round(km*10)/10);toast(`Izračunano: ${Math.round(km*10)/10} km (cestna razdalja, javni OSRM strežnik)`,'ok')};

/* =====================================================================
   Ponudbe – izvoz: DOCX (docx.js), PDF (pdfmake; rezerva: JPEG PDF)
   Ta datoteka ne uporablja DOM (razen v rasterski rezervi) – testirana tudi v Node.
   ===================================================================== */
const OB={BLUE:'2450B4',GRAY:'777777'};
function fitBox(w,h,mw,mh){const k=Math.min(mw/w,mh/h,1);return{w:Math.max(1,Math.round(w*k)),h:Math.max(1,Math.round(h*k))}}
function makeDocx(doc,D){
  const{Document,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,WidthType,ShadingType,AlignmentType,BorderStyle,LevelFormat,VerticalAlign}=D;
  const none={style:BorderStyle.NONE,size:0,color:'FFFFFF'},nb={top:none,bottom:none,left:none,right:none};
  const R=(t,o={})=>new TextRun({text:t,font:o.font||'Arial',size:o.size||22,bold:o.bold,italics:o.italics,color:o.color});
  const P=(ch,o={})=>new Paragraph({children:Array.isArray(ch)?ch:[ch],...o});
  const img=(im,mw,mh)=>{const s=fitBox(im.w,im.h,mw,mh);return new ImageRun({type:im.type||'jpg',data:im.bytes,transformation:{width:s.w,height:s.h}})};
  const kids=[];
  /* naslovnica */
  kids.push(P([R('Ponudba št. '+doc.no+' / ',{font:'Georgia',size:30,bold:true,italics:true}),R(doc.dateText,{font:'Georgia',size:26,italics:true})],{spacing:{after:120}}));
  kids.push(P(img(doc.logo,260,150),{spacing:{after:240}}));
  const c=doc.company;
  kids.push(P(R(c.name,{font:'Times New Roman',size:26,bold:true,italics:true})));
  c.addr.forEach(l=>kids.push(P(R(l,{font:'Times New Roman',size:24}))));

function jpegPagesToPdf(pages,land){const PW=land?841.89:595.28,PH=land?595.28:841.89;const enc=new TextEncoder(),chunks=[];let len=0;const offs=[];
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;chunks.push(u);len+=u.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
  push('%PDF-1.4\n%STIK\n');const n=pages.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`));
  pages.forEach((p,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.u8.length} >>\nstream\n`);push(p.u8);push('\nendstream')})});
  const xref=len,total=3*n+3;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let id=1;id<total;id++)x+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'})}

function offerHTML(doc){const L=doc.logo.src,c=doc.company;const n=doc.items.length;

  const sum=()=>`<div class="op-tot">${doc.totals.rows.map(r=>`<div>${esc(r[0])} ${esc(r[1])}</div>`).join('')}<div class="op-line">========================</div></div><div class="op-grand">${esc(doc.totals.grand[0])} ${esc(doc.totals.grand[1])}</div>
    ${doc.totals.avans.map(r=>`<div class="op-terms" style="font-size:15px">${esc(r[0])} ${esc(r[1])}</div>`).join('')}<div class="op-terms" style="margin-top:14px">${doc.terms.map(esc).join('<br>')}</div>${doc.note?`<div class="op-terms" style="margin-top:10px">${esc(doc.note).replace(/\n/g,'<br>')}</div>`:''}`;
  let h=`<section class="op"><div class="op-in"><div class="op-no">Ponudba št. ${esc(doc.no)} / <i>${esc(doc.dateText)}</i></div><img class="op-logo" src="${L}" alt="">
    <div class="op-co"><b><i>${esc(c.name)}</i></b><br>${c.addr.map(esc).join('<br>')}<br><i>${esc(c.contact)}</i><br><span class="u">${esc(c.sites)}</span></div>
    <div class="op-fis">${c.fiscal.map(esc).join('<br>')}</div>
    <div class="op-cust"><div class="lbl">Naziv:</div>${doc.customer.map((l,i)=>i?`<div>${esc(l)}</div>`:`<div class="nm">${esc(l)}</div>`).join('')}</div>
    <div class="op-note">(ponudba na naslednjih straneh...)</div></div>${foot(1,total)}</section>`;
  doc.items.forEach((it,i)=>{h+=`<section class="op"><div class="op-in"><h2 class="op-h">${esc(it.title)}</h2>${it.sub?`<div class="op-sub">${esc(it.sub)}</div>`:''}
    ${it.imgs.length?`<div class="op-img ${it.imgs.length>1?'multi':''}">${it.imgs.map((im,k)=>`<img ${k===0?'class="first"':''} src="${im.src}" alt="">`).join('')}</div>`:'<div style="height:60px"></div>'}
    <div class="op-banner"><img src="${L}" alt=""><span>${esc(doc.info)}</span></div>
    ${it.lines.map(l=>l.main?`<div class="op-p"><b>${esc(l.label)}</b> <span>${esc(l.text)}</span></div>`:`<div class="op-l">${esc(l.text)}</div>`).join('')}
    ${it.eq.length?`<div class="op-eqt">${esc(it.eqTitle)}</div><ul class="eq">${it.eq.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}
    <div class="op-dash"></div>${i===n-1?sum():''}</div>${foot(i+2,total)}</section>`});
  if(!n)h+=`<section class="op"><div class="op-in">${sum()}</div>${foot(2,total)}</section>`;return h}
const offerFile=(o,ext)=>('Ponudba_'+o.no+'_'+((o.kupec&&o.kupec.naziv)||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_')).replace(/_+$/,'')+'.'+ext;

function ensureCustomer(o){const K=o.kupec||{};if(o.kupecId||!K.naziv)return;const ex=DB.all('stranke').find(s=>s.naziv.toLowerCase()===K.naziv.toLowerCase());
  if(ex){o.kupecId=ex.id;return}const s=DB.upsert('stranke',{naziv:K.naziv,mail:K.mail||'',telefon:K.telefon||'',naslov:K.naslov||'',posta:K.posta||'',kraj:K.kraj||'',drzava:K.drzava||'',status:'Ponudba poslana',datum:todayStr()},{quiet:true});o.kupecId=s.id;DB.touch('ponudbe',o)}
async function exportDocx(o){const b=busy('Pripravljam Word dokument …');try{await loadScript(DOCX_URL,()=>window.docx);ensureCustomer(o);const doc=await buildOfferDoc(o,'export');const blob=await window.docx.Packer.toBlob(makeDocx(doc,window.docx));download(offerFile(o,'docx'),blob);toast('Word dokument je pripravljen – po potrebi ga lahko ročno popraviš.','ok')}
  catch(e){console.error(e);toast('Izvoz v Word ni uspel: '+e.message,'err')}finally{b.done()}}
async function pdfMakeBlob(def){await loadScript(PDFMAKE_URLS[0],()=>window.pdfMake);if(!(window.pdfMake&&window.pdfMake.vfs&&Object.keys(window.pdfMake.vfs).length))await loadScript(PDFMAKE_URLS[1]);
  return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('pdfmake timeout')),40000);try{window.pdfMake.createPdf(def).getBlob(b=>{clearTimeout(t);res(b)})}catch(e){clearTimeout(t);rej(e)}})}
const pdfViaPdfMake=doc=>pdfMakeBlob(makePdfDef(doc));
function offerCss(){const st=[...document.styleSheets].flatMap(s=>{try{return[...s.cssRules]}catch{return[]}});return st.filter(r=>r.selectorText&&/\.(op|rp)/.test(r.selectorText)).map(r=>r.cssText).join('\n')}
async function pagesToJpegPdf(els,W,q,land){const css=offerCss(),xs=new XMLSerializer(),pages=[],PH=land?794:1123,PW=land?1123:794;
  for(const el of els){el.style.boxShadow='none';const H=Math.max(PH,el.scrollHeight);if(!el.classList.contains('rp'))el.style.minHeight=H+'px';
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${H}"><foreignObject width="${PW}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css.replace(/</g,'&lt;')}</style>${xs.serializeToString(el)}</div></foreignObject></svg>`;
    const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));const sc=1.75,cv=document.createElement('canvas');cv.width=PW*sc;cv.height=H*sc;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
    const ph=PH*sc,n=Math.ceil(cv.height/ph-.02);for(let k=0;k<n;k++){const c2=document.createElement('canvas');c2.width=cv.width;c2.height=ph;const y=c2.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,c2.width,c2.height);y.drawImage(cv,0,-k*ph);
      const blob=await new Promise(r=>c2.toBlob(r,'image/jpeg',q));pages.push({u8:new Uint8Array(await blob.arrayBuffer()),w:c2.width,h:c2.height})}}
  return jpegPagesToPdf(pages,land)}
async function pdfViaRaster(doc,q){const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0';host.innerHTML=offerHTML(doc);document.body.append(host);
  try{return await pagesToJpegPdf($$('.op',host),794,q,false)}finally{host.remove()}}
async function exportPdf(o){const b=busy('Pripravljam PDF …');try{ensureCustomer(o);const doc=await buildOfferDoc(o,'export');let blob,how='';const q=Math.min(.95,Math.max(.3,num(DB.S().offers.imgQ||70)/100));
    try{blob=await pdfViaPdfMake(doc)}catch(e){console.warn('pdfmake ni uspel, uporabljam rezervno pot',e);b.set('Rezervna pot (slika strani) …');blob=await pdfViaRaster(doc,q);how=' (rezervna oblika: strani so slike)'}
    download(offerFile(o,'pdf'),blob);toast(`PDF je pripravljen – ${fmtBytes(blob.size)}${how}`,'ok')}
  catch(e){console.error(e);toast('Izvoz v PDF ni uspel: '+e.message,'err')}finally{b.done()}}

function emailDlg(o){const K=o.kupec||{},m=Modal.open({title:'E-pošta stranki',cls:'wide',body:`<div class="grid2"><div><label class="fl">Prejemnik</label><input class="in" id="em_to" value="${esc(K.mail||'')}"></div><div><label class="fl">Zadeva</label><input class="in" id="em_s" value="${esc('Ponudba št. '+o.no+' – '+DB.S().company.naziv)}"></div>

function barChart(data,{fmt=v=>v,h=170,color='var(--red)'}={}){const W=560,pl=8,mx=Math.max(1,...data.map(d=>d.v)),bw=(W-pl*2)/data.length;
  return`<svg viewBox="0 0 ${W} ${h+34}" style="width:100%;height:auto" role="img">${data.map((d,i)=>{const bh=Math.round(d.v/mx*h),x=pl+i*bw+bw*.16;return`<g><rect x="${x}" y="${h-bh+14}" width="${bw*.68}" height="${Math.max(bh,d.v?2:0)}" rx="3" fill="${color}" opacity="${d.v?1:.2}"/><text x="${x+bw*.34}" y="${h-bh+9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.v?esc(fmt(d.v)):''}</text><text x="${x+bw*.34}" y="${h+28}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.l)}</text></g>`}).join('')}<line x1="0" x2="${W}" y1="${h+14}" y2="${h+14}" stroke="var(--line)"/></svg>`}
Views.porocila=function(root){const draw=()=>{const P=DB.all('ponudbe'),now=new Date(),months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:monthNames[d.getMonth()].slice(0,3)})}

    <div class="two" style="margin-bottom:14px"><div class="card pad"><h3>DFA – zapadlosti v naslednjih 6 mesecih</h3>${barChart(dueM,{fmt:v=>Math.round(v/100)/10+'k',color:'var(--amber)'})}</div><div class="card pad"><h3>Prevoženi km po mesecih</h3>${barChart(km,{color:'var(--green)'})}</div></div>

    $('#px',root).onclick=()=>{const bars=(a,f)=>a.map(m=>({l:m.l,v:m.v,txt:f(m.v)}));exportRDoc({title:'Poročila',sub:fmtDate(todayStr()),file:'porocila',blocks:[{t:'h',text:'Sprejete ponudbe po mesecih (brez DDV)'},{t:'bars',rows:bars(accM,money)},{t:'h',text:'Število ponudb po mesecih'},{t:'bars',rows:bars(cntM,v=>String(v))},{t:'h',text:'Ponudbe po statusu'},{t:'table',cols:[{l:'Status'},{l:'Število',align:'right'},{l:'Vrednost z DDV',align:'right'}],rows:stat.map(r=>[r.s,String(r.n),money(r.v)])},{t:'h',text:'Najbolj prodajani izdelki (sprejete ponudbe)'},{t:'table',cols:[{l:'Izdelek'},{l:'Kosov',align:'right'},{l:'Vrednost',align:'right'}],rows:top.map(([k,v])=>[k,String(v.n),money(v.v)]),empty:'Še ni sprejetih ponudb.'},{t:'h',text:'DFA – zapadlosti v naslednjih 6 mesecih'},{t:'bars',rows:bars(dueM,money)},{t:'h',text:'Prevoženi km po mesecih'},{t:'bars',rows:bars(km,v=>String(v))},{t:'h',text:'Fiksni stroški'},{t:'kv',rows:[['Naročnine / mesec',money(sumBy(nar,'znesek'))],['Telefoni / mesec',money(sumBy(tel,'znesek'))],['Skupaj / leto',money((sumBy(nar,'znesek')+sumBy(tel,'znesek'))*12)]]}]})};
    $('#ex',root).onclick=()=>download('ponudbe-'+todayStr()+'.csv',toCSV([['Št.','Datum','Kupec','Status','Brez DDV','DDV','Skupaj','Avans','Rok dobave'],...P.map(o=>{const c=calcOffer(o);return[o.no,fmtDate(o.datum),(o.kupec||{}).naziv||'',o.status,plain(c.neto),plain(c.ddv),plain(c.total),plain(c.avans),o.rokDobave||'']})]),'text/csv;charset=utf-8')};

Views.ai=function(root){const chips=['Napiši e-pošto stranki, ki čaka na ponudbo','Prevedi v angleščino:','Prevedi v nemščino:','Napiši oglas za Bolha.com za:','Kaj moram narediti ta teden?','Povzemi zapadla plačila'];

/* =====================================================================
   PDF izvoz za vse rubrike (seznam, posamezen zapis, mape, koledar, poročila …)
   Vmesni zapis dokumenta (RDoc) -> pdfmake (vektorski PDF) ali rezerva: strani kot slike v PDF
   ===================================================================== */
const fileSlug=s=>String(s||'dokument').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'dokument';
const _th=new Map();
async function thumbURL(id,max,q){const k=id+'@'+max;if(_th.has(k))return _th.get(k);const b=await Blobs.get(id,'image/jpeg');if(!b)return'';
  try{const c=await compressImage(b,{max,q:q||.72});const d=await blobToDataURL(c);_th.set(k,d);return d}catch{return''}}
function pdfVal(r,f){const v=fieldVal(r,f);
  switch(f.t){case'money':return v===''||v==null?'':money(v);case'percent':return v===''||v==null?'':String(v).replace('.',',')+' %';case'number':return v===''||v==null?'':String(v).replace('.',',');
    case'date':return fmtDate(v);case'datetime':return fmtDT(v);case'check':return v?'Da':'Ne';case'select':return String(optLbl((f.opts||[]).find(o=>optVal(o)===v)||v)||'');
    case'files':return(v||[]).map(x=>x.name).join(', ');case'image':return'';
    case'computed':return f.fmt==='money'?(v===''?'':money(v)):f.fmt==='percent'?String(v).replace('.',',')+' %':f.fmt==='html'?stripTags(v):String(v??'');
    default:return v==null?'':String(v)}}
const isNumCol=f=>['money','number','percent'].includes(f.t)||(f.t==='computed'&&['money','percent'].includes(f.fmt));

/* ----- sestava dokumentov ----- */
async function listDoc(M,L,sub){const cols=M.fields.filter(f=>f.list);let n=0;const rows=[];
  for(const r of L){const row=[];for(const f of cols){if(f.t==='image')row.push(r[f.k]&&n<300?{img:await thumbURL(r[f.k],110)}:'');else if(f.t==='files')row.push((r[f.k]||[]).length?String(r[f.k].length):'');else row.push(pdfVal(r,f))}n++;rows.push(row)}
  const tot=M.totals||{},foot=Object.keys(tot).length?cols.map((f,i)=>tot[f.k]?(f.t==='number'?String(r2(sumBy(L,r=>fieldVal(r,f)))).replace('.',','):money(sumBy(L,r=>fieldVal(r,f)))):(i===0?'Skupaj':'')):null;
  const blocks=[];if(M.kpis){const k=M.kpis(L);if(k.length)blocks.push({t:'kv',rows:k.map(x=>[x[0],x[1]+(x[2]?'  ('+x[2]+')':'')])})}
  blocks.push({t:'table',cols:cols.map(f=>({l:f.l,align:isNumCol(f)?'right':'left'})),rows,foot,empty:'Ni zapisov.'});
  return{title:M.title,sub,land:cols.length>=6,blocks,file:M.key}}
async function recordDoc(M,r){const rows=[],imgs=[],files=[];
  for(const f of M.fields){const v=fieldVal(r,f);
    if(f.t==='image'){if(v){const u=await thumbURL(v,900,.75);if(u)imgs.push(u)}continue}
    if(f.t==='files'){for(const x of(v||[])){files.push(x.name+(x.size?' ('+fmtBytes(x.size)+')':''));if((x.type||'').startsWith('image/')&&imgs.length<9){const u=await thumbURL(x.id,700,.72);if(u)imgs.push(u)}}continue}
    const s=pdfVal(r,f);if(s!=='')rows.push([f.l,s])}
  const blocks=[{t:'kv',rows}];if(imgs.length)blocks.push({t:'imgs',items:imgs});if(files.length){blocks.push({t:'h',text:'Priloge'});blocks.push({t:'list',items:files})}
  return{title:titleOf(M.key,r)||M.title,sub:M.title+' · '+fmtDate(todayStr()),blocks,file:M.key+'_'+(titleOf(M.key,r)||'')}}
async function offersListDoc(L){const rows=L.map(o=>{const c=calcOffer(o);return[String(o.no),fmtDate(o.datum),(o.kupec||{}).naziv||'',o.items.map(i=>i.naslov).join(', '),money(c.total),c.avans?money(c.avans):'',o.status||'',o.rokDobave||'']});
  return{title:'Slikovne ponudbe',sub:`${L.length} ponudb · ${fmtDate(todayStr())}`,land:true,file:'ponudbe',blocks:[{t:'table',cols:['Št.','Datum','Kupec','Izdelki','Skupaj z DDV','Avans','Status','Rok dobave'].map((l,i)=>({l,align:i===4||i===5?'right':'left'})),rows,foot:['','','','Skupaj',money(sumBy(L,offerTotal)),'','',''],empty:'Ni ponudb.'}]}}
function folderDoc(cfg,path,folders,items){const blocks=[];
  if(folders.length){blocks.push({t:'h',text:'Podmape'});blocks.push({t:'table',cols:[{l:'Mapa'},{l:'Elementov',align:'right'}],rows:folders.map(f=>[f.name,String(DB.all('datoteke').filter(x=>x.folder===f.id).length+DB.all('mape').filter(x=>x.parent===f.id).length)])})}
  blocks.push({t:'h',text:'Vsebina'});blocks.push({t:'table',cols:[{l:'Ime'},{l:'Vrsta'},{l:'Datum'},{l:'Velikost / povezava'},{l:'Opomba'}],empty:'Mapa je prazna.',
    rows:items.map(x=>[x.name,x.kind==='link'?'Povezava':x.kind==='note'?'Beležka':(x.type||'Datoteka'),fmtDate(x.date),x.size?fmtBytes(x.size):(x.url||''),x.note||''])});
  items.filter(x=>x.kind==='note'&&x.text).forEach(x=>{blocks.push({t:'h',text:x.name});x.text.split('\n').forEach(l=>blocks.push({t:'p',text:l||' '}))});
  return{title:cfg.title,sub:(path.length?path.map(p=>p.name).join(' / ')+' · ':'')+fmtDate(todayStr()),land:true,blocks,file:'mapa_'+cfg.title}}
const noteDoc=x=>({title:x.name,sub:fmtDate(x.date),blocks:String(x.text||'').split('\n').map(l=>({t:'p',text:l||' '})),file:'belezka_'+x.name});

/* ----- pdfmake ----- */
function rdocToPdfMake(rd,logoUrl,co){
  const land=!!rd.land,content=[],line='#DDE3E9',lay={hLineColor:()=>line,vLineColor:()=>line,hLineWidth:()=>.5,vLineWidth:()=>.5,paddingTop:()=>3,paddingBottom:()=>3};
  content.push({text:rd.title,fontSize:17,bold:true,margin:[0,0,0,2]});if(rd.sub)content.push({text:rd.sub,color:'#666666',fontSize:9,margin:[0,0,0,10]});
  const colW=(b,i)=>{if(b.cols[i].w)return b.cols[i].w;let m=String(b.cols[i].l).length;b.rows.slice(0,60).forEach(r=>{const v=r[i];if(v&&v.img)m=Math.max(m,6);else m=Math.max(m,String(v??'').length)});return m<=13?'auto':'*'};
  for(const b of rd.blocks){
    if(b.t==='h')content.push({text:b.text,fontSize:12,bold:true,margin:[0,10,0,4]});
    else if(b.t==='p')content.push({text:b.text,fontSize:10.5,margin:[0,0,0,3]});
    else if(b.t==='list')content.push({ul:b.items,fontSize:10,margin:[0,0,0,6]});
    else if(b.t==='kv'){if(b.rows.length)content.push({table:{widths:[130,'*'],body:b.rows.map(r=>[{text:r[0],bold:true,fontSize:9.5,color:'#333333',fillColor:'#F3F5F8'},{text:String(r[1]),fontSize:10}])},layout:lay,margin:[0,0,0,8]})}
    else if(b.t==='imgs'){for(let i=0;i<b.items.length;i+=2)content.push({columns:b.items.slice(i,i+2).map(u=>({image:u,fit:[land?330:250,190]})),columnGap:8,margin:[0,4,0,8]})}
    else if(b.t==='bars'){const mx=Math.max(1,...b.rows.map(r=>r.v));content.push({table:{widths:[130,250,'*'],body:b.rows.map(r=>[{text:r.l,fontSize:9},{canvas:[{type:'rect',x:0,y:1,w:Math.max(1,r.v/mx*230),h:8,color:'#E5312E'}]},{text:r.txt,fontSize:9,alignment:'right'}])},layout:lay,margin:[0,0,0,8]})}
    else if(b.t==='table'){if(!b.rows.length){content.push({text:b.empty||'Ni zapisov.',color:'#666666',margin:[0,0,0,8]});continue}
      const al=i=>b.cols[i].align||'left',body=[b.cols.map((c,i)=>({text:c.l,bold:true,fontSize:8.5,fillColor:'#EEF1F5',alignment:al(i)}))];
      b.rows.forEach(row=>body.push(row.map((v,i)=>v&&v.img?{image:v.img,fit:[46,34]}:{text:String(v??''),fontSize:8.5,alignment:al(i)})));
      if(b.foot)body.push(b.foot.map((v,i)=>({text:String(v??''),bold:true,fontSize:8.5,fillColor:'#F7F8FA',alignment:al(i)})));
      content.push({table:{headerRows:1,widths:b.cols.map((c,i)=>colW(b,i)),body,dontBreakRows:true},layout:lay,margin:[0,0,0,8]})}}
  return{pageSize:'A4',pageOrientation:land?'landscape':'portrait',pageMargins:[36,62,36,40],info:{title:rd.title,author:co.naziv},defaultStyle:{font:'Roboto',fontSize:10},content,
    header:{margin:[36,18,36,0],columns:[{image:logoUrl,width:52},{text:co.naziv+'\n'+[co.naslov,[co.posta,co.kraj].filter(Boolean).join(' ')].filter(Boolean).join(', '),fontSize:8,color:'#555555',margin:[8,4,0,0]},{text:fmtDate(todayStr()),alignment:'right',fontSize:8,color:'#555555',margin:[0,4,0,0]}]},
    footer:(p,n)=>({text:`STIK OS · ${rd.title} · stran ${p}/${n}`,alignment:'center',fontSize:8,color:'#999999',margin:[0,12,0,0]})}}

/* ----- rezerva: HTML strani -> JPEG PDF ----- */
function rdocPages(rd,logoUrl,co){const W=rd.land?1123:794,H=rd.land?794:1123,host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0';document.body.append(host);
  const pages=[];let body;const cell=v=>v&&v.img?`<img src="${v.img}" alt="">`:esc(v??'').replace(/\n/g,'<br>');
  const newPage=()=>{const s=document.createElement('section');s.className='rp';s.style.width=W+'px';s.style.height=H+'px';
    s.innerHTML=`<div class="rp-h"><img src="${logoUrl}" alt=""><div><b>${esc(co.naziv)}</b><small>${esc([co.naslov,[co.posta,co.kraj].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</small></div><span>${fmtDate(todayStr())}</span></div><div class="rp-b"></div><div class="rp-f"></div>`;
    host.append(s);pages.push(s);body=$('.rp-b',s)};
  const fits=()=>body.scrollHeight<=body.clientHeight+1;
  const atomic=el=>{body.append(el);if(!fits()&&body.children.length>1){el.remove();newPage();body.append(el)}};
  const rowsBlock=(head,rows,rowHtml,foot)=>{let tbl,tb;const mk=()=>{tbl=document.createElement('table');tbl.className='rp-t';tbl.innerHTML=(head?`<thead><tr>${head}</tr></thead>`:'')+'<tbody></tbody>';tb=$('tbody',tbl);body.append(tbl)};
    const add=html=>{const tr=document.createElement('tr');tr.innerHTML=html;tb.append(tr);if(!fits()){tr.remove();if(!tb.children.length&&body.children.length>1){tbl.remove()}newPage();mk();tb.append(tr)}return tr};
    mk();rows.forEach(r=>add(rowHtml(r)));if(foot)add(foot).className='ft'};
  newPage();const t=document.createElement('div');t.innerHTML=`<div class="rp-title">${esc(rd.title)}</div>${rd.sub?`<div class="rp-sub">${esc(rd.sub)}</div>`:''}`;body.append(t);
  for(const b of rd.blocks){
    if(b.t==='h'){const e=document.createElement('div');e.className='rp-hh';e.textContent=b.text;atomic(e)}
    else if(b.t==='p'){const e=document.createElement('div');e.className='rp-p';e.textContent=b.text;atomic(e)}
    else if(b.t==='imgs'){const e=document.createElement('div');e.className='rp-imgs';e.innerHTML=b.items.map(u=>`<img src="${u}" alt="">`).join('');atomic(e)}
    else if(b.t==='list')rowsBlock('',b.items,i=>`<td>• ${esc(i)}</td>`)
    else if(b.t==='kv')rowsBlock('',b.rows,r=>`<td class="k">${esc(r[0])}</td><td>${cell(r[1])}</td>`)
    else if(b.t==='bars'){const mx=Math.max(1,...b.rows.map(r=>r.v));rowsBlock('',b.rows,r=>`<td style="width:24%">${esc(r.l)}</td><td><div class="rp-bar"><i style="width:${Math.max(1,Math.round(r.v/mx*100))}%"></i></div></td><td class="r" style="width:16%">${esc(r.txt)}</td>`)}
    else if(b.t==='table'){if(!b.rows.length){const e=document.createElement('div');e.className='rp-p';e.textContent=b.empty||'Ni zapisov.';atomic(e);continue}
      rowsBlock(b.cols.map(c=>`<th class="${c.align==='right'?'r':''}">${esc(c.l)}</th>`).join(''),b.rows,r=>r.map((v,i)=>`<td class="${b.cols[i].align==='right'?'r':''}">${cell(v)}</td>`).join(''),b.foot?b.foot.map((v,i)=>`<td class="${b.cols[i].align==='right'?'r':''}">${cell(v)}</td>`).join(''):'')}}
  pages.forEach((s,i)=>{$('.rp-f',s).textContent=`STIK OS · ${rd.title} · stran ${i+1}/${pages.length}`});
  return{host,pages,W,H}}
async function rdocRaster(rd,logoUrl,co,q){const{host,pages,W}=rdocPages(rd,logoUrl,co);try{return await pagesToJpegPdf(pages,W,q,rd.land)}finally{host.remove()}}

/* ----- izvoz ----- */
async function exportRDoc(rd){const b=busy('Pripravljam PDF …');
  try{const S=DB.S(),co=S.company,logo=await getLogo(),q=Math.min(.95,Math.max(.3,num(S.offers.imgQ||70)/100));let blob,how='';
    try{blob=await pdfMakeBlob(rdocToPdfMake(rd,logo.dataUrl,co))}catch(e){console.warn('pdfmake ni uspel, rezervna pot',e);b.set('Rezervna pot (slika strani) …');blob=await rdocRaster(rd,logo.dataUrl,co,q);how=' (rezervna oblika: strani so slike)'}
    download(fileSlug(rd.file||rd.title)+'_'+todayStr()+'.pdf',blob);toast(`PDF je pripravljen – ${fmtBytes(blob.size)}${how}`,'ok')}
  catch(e){console.error(e);toast('Izvoz v PDF ni uspel: '+e.message,'err')}finally{b.done()}}
async function pdfList(M,L,sub){const b=busy('Sestavljam dokument …');let rd;try{rd=await listDoc(M,L,sub)}finally{b.done()}return exportRDoc(rd)}
async function pdfRecord(M,r){const b=busy('Sestavljam dokument …');let rd;try{rd=await recordDoc(M,r)}finally{b.done()}return exportRDoc(rd)}

/* =====================================================================
   Aplikacija: navigacija, usmerjevalnik, zagon
   ===================================================================== */
const App={cur:null,
  navItem(s){const[t,k]=s.split(':');if(t==='s')return{href:'#/'+k,title:SPECIAL[k].title,icon:SPECIAL[k].icon,key:k,t};if(t==='m')return{href:'#/m/'+k,title:MODULES[k].title,icon:MODULES[k].icon,key:k,t};return{href:'#/mape/'+k,title:FOLDERS[k].title,icon:FOLDERS[k].icon,key:k,t}},
  renderNav(){const hash=location.hash||'#/dashboard';
    $('#nav').innerHTML=NAV.map(g=>`${g.g?`<h6>${g.g}</h6>`:''}${g.items.map(s=>{const i=this.navItem(s);let cnt='';
      if(i.t==='m'&&MODULES[i.key].badge){const b=MODULES[i.key].badge(DB.all(i.key));if(b.n)cnt=`<span class="cnt ${b.hot?'hot':''}">${b.hot||b.n}</span>`}
      if(i.key==='ponudbe'){const n=DB.all('ponudbe').filter(o=>['Osnutek','Poslana'].includes(o.status)).length;if(n)cnt=`<span class="cnt">${n}</span>`}
      const on=hash===i.href||hash.startsWith(i.href+'/');return`<a href="${i.href}" class="${on?'on':''}">${ic(i.icon)}<span>${esc(i.title)}</span>${cnt}</a>`}).join('')}`).join('')},
  applyTheme(){const t=DB.S().theme||'auto',dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'},
  route(){const p=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent),a=p[0]||'dashboard',b=p[1],c=p[2];
    if(this.cur&&this.cur.destroy)try{this.cur.destroy()}catch(e){console.error(e)}this.cur=null;
    const view=$('#view');view.innerHTML='';const root=document.createElement('div');view.append(root);let title='STIK OS';
    try{if(a==='m'){this.cur=Views.module(root,b,c);title=MODULES[b]?MODULES[b].title:title}
      else if(a==='ponudbe'){this.cur=b?Views.ponudba(root,b):Views.ponudbe(root);title='Ponudbe'}
      else if(a==='mape'){this.cur=Views.mape(root,b,c);title=(folderCfg(b)||{}).title||'Mape'}
      else if(Views[a]&&SPECIAL[a]){this.cur=Views[a](root,b);title=SPECIAL[a].title}
      else{location.replace('#/dashboard');return}}
    catch(e){console.error(e);root.innerHTML=`<div class="card empty"><h3>Napaka pri prikazu</h3><p>${esc(e.message)}</p></div>`}
    document.title=title+' · STIK OS';window.scrollTo(0,0);document.body.classList.remove('nav-open');this.renderNav()},
  syncPill(){const p=$('#syncPill'),s=Store.state;p.className='pill '+({ok:'ok',busy:'busy',dirty:'busy',error:'err',auth:'err',offline:'err'}[s]||'');$('#syncTxt').textContent=Store.label();p.title=Store.err||Store.label()}};
function seedDefaults(){const m=DB.data.meta;m.seeded=m.seeded||{};if(m.seeded.dej)return;
  if(!DB.all('dejavnosti').length)[['dej_pickupoprema','Pickupoprema.si','https://www.pickupoprema.si','Spletna trgovina z opremo za pick-up vozila'],['dej_roadranger','Roadranger.si','https://www.roadranger.si',''],['dej_avengerbox','Avengerbox.si','https://www.avengerbox.si','']].forEach(([id,naziv,url,opombe])=>{const t=nowIso();DB.col('dejavnosti').push({id,naziv,url,opombe,_c:t,_u:t})});
  m.seeded.dej=1;Store.touch()}
window.addEventListener('hashchange',()=>App.route());
bus.on('sync',()=>App.syncPill());
bus.on('data',debounce(()=>{App.renderNav();if(App.cur&&App.cur.onData&&!Modal.stack.length)App.cur.onData()},180));
bus.on('data',()=>App.applyTheme());
$('#burger').onclick=()=>document.body.classList.toggle('nav-open');
$('#view').addEventListener('click',()=>document.body.classList.remove('nav-open'));
$('#searchBtn').onclick=openSearch;
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';DB.S().theme=dark?'light':'dark';Store.touch();App.applyTheme()};
$('#syncPill').onclick=async()=>{const s=Store.state;
  if(s==='auth'){if(Store.kind()==='folder'){if(await FSA.ensure(true))Store.pull(true)}else location.hash='#/nastavitve'}
  else if(s==='error'||s==='offline'||Store.dirty)Store.flush();else if(Store.canSync())Store.pull(true);else location.hash='#/nastavitve'};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
  else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!Modal.stack.length){e.preventDefault();openSearch()}});
(async function boot(){
  try{const cached=await Store.boot();App.applyTheme();App.syncPill();App.route();
    if(Store.canSync())await Store.pull();
    seedDefaults();App.applyTheme();App.renderNav();
    if(Store.kind()==='none'&&!cached)Views._connect();else if(Store.kind()==='none'){Store.cfg={mode:'local'};Store.saveCfg()}
    Blobs.flushQueue()}
  catch(e){console.error(e);$('#view').innerHTML=`<div class="card empty"><h3>Zagon ni uspel</h3><p>${esc(e.message)}</p></div>`}})();

</script>
